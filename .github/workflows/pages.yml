name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Install homepage check browser
        run: |
          npm install --prefix "$RUNNER_TEMP/homepage-check" --no-save --package-lock=false playwright@1.62.1
          "$RUNNER_TEMP/homepage-check/node_modules/.bin/playwright" install --with-deps chromium

      - name: Verify homepage layout and navigation
        env:
          NODE_PATH: ${{ runner.temp }}/homepage-check/node_modules
          VISUAL_OUTPUT: ${{ runner.temp }}/homepage-screenshots
        run: node scripts/check-homepage.cjs

      - name: Upload homepage screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: homepage-screenshots
          path: ${{ runner.temp }}/homepage-screenshots
          if-no-files-found: ignore

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
